# Blueprint Render per Argus Total — servizi e DB SEPARATI da Argus Smart.
# NB: le credenziali del SECONDO account Copernicus si impostano a mano nel
# dashboard (sync:false) → non finiscono mai nel repo.
#
# Deploy: Render → New + → Blueprint → collega il repo → Apply.
# Poi imposta le env var sync:false (vedi DEPLOY.md) e ridistribuisci il frontend.

databases:
  - name: argus-total-db
    databaseName: argus_total
    plan: basic-256mb

services:
  # ---------------- Backend FastAPI ----------------
  - type: web
    name: argus-total-api
    runtime: python
    # Standard (2 GB / 1 CPU). Misurato sul progetto Poligono A (121 pivot,
    # ~10.000 ha): 164 MB a riposo e ~270 MB di picco durante un export. Sul
    # piano free (512 MB / 0,1 CPU) il margine era di poche decine di MB e il
    # servizio si riavviava; con CDSE attivo i raster reali pesano di piu' dei
    # sintetici su cui ho misurato. Lo Starter costa meno ma ha ancora 512 MB:
    # toglierebbe solo il risveglio a freddo, non il tetto di memoria.
    plan: standard
    rootDir: backend
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: argus-total-db
          property: connectionString
      - key: PROVIDER_MODE
        value: synthetic          # passare a "cdse" quando l'account è pronto
      - key: CDSE_CLIENT_ID
        sync: false               # SECONDO account CDSE — inserire nel dashboard
      - key: CDSE_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false               # URL del frontend, es. https://argus-total-web.onrender.com

  # ---------------- Frontend Next.js ----------------
  # NB: NEXT_PUBLIC_API_BASE viene "incorporato" nel build → dopo averlo impostato
  # va rifatto il deploy del frontend (Clear build cache & deploy).
  - type: web
    name: argus-total-web
    runtime: node
    # Starter: al frontend serve soprattutto non andare in sospensione (il
    # piano free spegne il servizio dopo un periodo di inattivita' e la prima
    # visita paga ~40 s di risveglio). 512 MB bastano per servire Next.js.
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: NEXT_PUBLIC_API_BASE
        sync: false               # URL del backend, es. https://argus-total-api.onrender.com
